apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPBackend
metadata:
  name: basic-mcp-backend
  namespace: default
spec:
  backendRef:
    name: mcp-eg-backend
    kind: Backend
    group: gateway.envoyproxy.io
  path: /mcp
  toolSelector:
    include:
      - echo
  forwardHeaders:
    - name: Authorization
      backendHeader: X-Backend-Auth
